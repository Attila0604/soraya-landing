<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Seite nicht gefunden · Soraya</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0b0713" />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style>
  /* gleiche Schriften und Farben wie Landingpage und App */
  @font-face{font-family:"Cinzel";font-weight:500 700;font-display:swap;src:url("/fonts/cinzel-ext.woff2") format("woff2");unicode-range:U+0100-017F}
  @font-face{font-family:"Cinzel";font-weight:500 700;font-display:swap;src:url("/fonts/cinzel.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-display:swap;src:url("/fonts/cormorant-kursiv-ext.woff2") format("woff2");unicode-range:U+0100-017F}
  @font-face{font-family:"Cormorant Garamond";font-style:italic;font-weight:500;font-display:swap;src:url("/fonts/cormorant-kursiv.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:"Inter";font-weight:400 600;font-display:swap;src:url("/fonts/inter-ext.woff2") format("woff2");unicode-range:U+0100-017F}
  @font-face{font-family:"Inter";font-weight:400 600;font-display:swap;src:url("/fonts/inter.woff2") format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
  :root{--void:#0b0713; --gold:#c9a86a; --gold-soft:#e6cf9c; --gold-dim:rgba(201,168,106,.42); --mist:#c3b7da; --mist-dim:#8a7ea6; --ink:#f4eedd}
  *{box-sizing:border-box}
  html,body{margin:0; min-height:100%}
  body{min-height:100svh; display:grid; place-items:center; padding:40px 20px; text-align:center; color:var(--mist);
    font:400 16px/1.6 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 600px at 70% -10%, rgba(120,74,190,.22), transparent 60%), linear-gradient(180deg,#0e0a22,#0a0618 55%,#060410) fixed, var(--void)}
  main{max-width:440px}
  img{display:block; margin:0 auto 18px; filter:drop-shadow(0 0 22px rgba(201,168,106,.35))}
  .marke{font:600 15px/1 "Cinzel",serif; letter-spacing:.36em; text-indent:.36em; color:var(--gold-soft); margin:0 0 28px}
  .code{font:500 11px/1 "Cinzel",serif; letter-spacing:.34em; text-indent:.34em; color:var(--gold); margin:0 0 12px}
  h1{font:italic 500 clamp(28px,7vw,38px)/1.2 "Cormorant Garamond",Georgia,serif; color:var(--ink); margin:0 0 12px; text-wrap:balance}
  p{margin:0 0 28px; color:var(--mist-dim); text-wrap:balance}
  .knopf{display:inline-flex; align-items:center; justify-content:center; min-height:50px; padding:14px 30px; border-radius:999px; text-decoration:none;
    background:linear-gradient(180deg,#e6cf9c,#c9a86a); color:#1a1209; font:600 15px/1 "Inter",sans-serif; box-shadow:0 10px 30px -12px rgba(201,168,106,.6)}
  .knopf:hover{filter:brightness(1.05)}
  .neben{display:block; margin-top:18px; font-size:14px; color:var(--gold-soft); text-decoration:underline; text-decoration-color:var(--gold-dim); text-underline-offset:4px; padding:8px 0}
  a:focus-visible{outline:2px solid var(--gold-soft); outline-offset:3px; border-radius:999px}
</style>
</head>
<body>
<main>
  <img src="/brand/zeichen.svg" alt="" width="72" height="68">
  <div class="marke">SORAYA</div>
  <div class="code">404</div>
  <h1 id="t1">Diese Seite steht nicht in den Sternen.</h1>
  <p id="t2">Der Link ist vielleicht alt oder falsch geschrieben. Auf der Startseite findest du alles über Soraya.</p>
  <a class="knopf" id="t3" href="/">Zur Startseite</a>
  <a class="neben" id="t4" href="https://app.sorayaluxuryastroguide.com/">Soraya öffnen ›</a>
</main>
<script>
  (function(){
    var T = {
      en: ["Page not found · Soraya", "This page isn't written in the stars.", "The link may be old or mistyped. You'll find everything about Soraya on the home page.", "Go to the home page", "Open Soraya ›"],
      hu: ["Az oldal nem található · Soraya", "Ez az oldal nincs megírva a csillagokban.", "Lehet, hogy a link régi vagy elírták. A kezdőoldalon mindent megtalálsz a Sorayáról.", "Vissza a kezdőoldalra", "Soraya megnyitása ›"],
      it: ["Pagina non trovata · Soraya", "Questa pagina non è scritta nelle stelle.", "Il link potrebbe essere vecchio o scritto male. Nella home trovi tutto su Soraya.", "Vai alla home", "Apri Soraya ›"]
    };
    var A = ["de", "en", "hu", "it"], lang = "";
    try { var q = new URLSearchParams(location.search).get("lang"); if (A.indexOf(q) >= 0) lang = q; } catch (e) {}
    if (!lang) { try { var s = localStorage.getItem("soraya_lang"); if (A.indexOf(s) >= 0) lang = s; } catch (e) {} }
    if (!lang) { var l = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
      for (var i = 0; i < l.length && !lang; i++) { var c = String(l[i]).slice(0, 2).toLowerCase(); if (A.indexOf(c) >= 0) lang = c; } }
    if (!lang) lang = "en";
    document.documentElement.lang = lang;
    var t = T[lang];
    if (t) {
      document.title = t[0];
      ["t1", "t2", "t3", "t4"].forEach(function (id, i) { document.getElementById(id).textContent = t[i + 1]; });
    }
    document.getElementById("t3").href = "/?lang=" + lang;
    document.getElementById("t4").href = "https://app.sorayaluxuryastroguide.com/?lang=" + lang;
  })();
</script>
</body>
</html>
